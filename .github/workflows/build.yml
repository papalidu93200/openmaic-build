name: Build OpenMAIC

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "Version d'OpenMAIC a compiler"
        default: "v1.2.0-rc.2"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer OpenMAIC (code officiel)
        uses: actions/checkout@v4
        with:
          repository: THU-MAIC/OpenMAIC
          ref: ${{ inputs.version || 'v1.2.0-rc.2' }}

      - uses: docker/setup-buildx-action@v3

      - name: Connexion au registre GitHub
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Nom du proprietaire en minuscules
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Compiler et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER }}/openmaic:${{ inputs.version || 'v1.2.0-rc.2' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
